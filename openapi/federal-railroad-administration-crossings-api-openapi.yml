openapi: 3.2.0
info:
  title: Federal Railroad Administration Public Crossings API
  description: The FRA Public API provides access to railroad safety datasets including accidents, incidents, highway-rail grade crossings, inspections, and operational data published through the FRA Office of Safety Analysis.
  version: '1.0'
  contact:
    name: Federal Railroad Administration
    url: https://safetydata.fra.dot.gov/MasterWebService/publicapi/
servers:
- url: https://safetydata.fra.dot.gov/MasterWebService/publicapi
  description: Production
tags:
- name: Crossings
paths:
  /crossings:
    get:
      summary: Retrieve highway-rail grade crossing inventory
      operationId: listCrossings
      parameters:
      - name: state
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Crossing inventory records
      tags:
      - Crossings
