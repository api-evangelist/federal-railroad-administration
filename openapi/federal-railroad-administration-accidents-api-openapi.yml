openapi: 3.0.3
info:
  title: Federal Railroad Administration Public Accidents API
  description: The FRA Public API provides access to railroad safety datasets including accidents, incidents, highway-rail grade crossings, inspections, and operational data published through the FRA Office of Safety Analysis.
  version: '1.0'
  contact:
    name: Federal Railroad Administration
    url: https://safetydata.fra.dot.gov/MasterWebService/publicapi/
servers:
- url: https://safetydata.fra.dot.gov/MasterWebService/publicapi
  description: Production
tags:
- name: Accidents
paths:
  /accidents:
    get:
      summary: Retrieve railroad accident records
      operationId: listAccidents
      parameters:
      - name: year
        in: query
        schema:
          type: integer
      - name: railroad
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Accident records
      tags:
      - Accidents
